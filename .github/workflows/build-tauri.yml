name: Build Tauri (installer ChatStream Labs)

# Ini satu-satunya workflow (workflow Electron lama sudah dihapus di v1.1.4).
# v1.1.8: jalan HANYA saat ada push TAG v<versi> (contoh: git tag v1.1.8 && git push origin v1.1.8) atau lewat tombol Run workflow (uji build saja, tanpa rilis).
#   Push biasa ke main tidak membuild lagi (hemat menit Actions; tidak ada artifact karena kuota artifact repo Private habis).
# Tag v<versi> = GitHub Release PRA-RILIS (prerelease) berjudul "ChatStream Labs v<versi>", asetnya HANYA installer .exe
#   (+ "Source code" .zip dan .tar.gz yang dibuat GitHub sendiri). Tidak ada berkas .sha256: SHA-256 ada di catatan rilis dan di 'digest' aset.
# Rilis inilah yang dibaca auto-update di aplikasi (pra-rilis ikut dibaca). Repo harus PUBLIC agar aplikasi bisa membacanya tanpa login.
# v1.1.12: OTOMATIS. Setiap push ke main (selain yang hanya mengubah berkas .md) = build + pra-rilis baru, tanpa tombol dan tanpa tag manual.
#   Nomor versi: pakai versi di package.json; kalau tag v<versi> itu sudah ada di GitHub, naik otomatis (patch +1) sampai ketemu yang belum dipakai.
#   Penaikan ini HANYA di mesin build (tidak di-commit ke repo), jadi berkas di repo tidak berubah sendiri. Mau lompat versi (mis. 1.2.0): naikkan sendiri
#   lewat `node scripts/version.js set 1.2.0`, maka rilis berikutnya mulai dari sana. Cara lama (push tag v<versi>) masih bisa.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: rilis-chatstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: tidak mengunduh binary Electron (tidak dipakai di sini)
      - name: Pasang dependensi
        run: npm ci --ignore-scripts

      # Push ke main: cari nomor versi yang belum dipakai tag mana pun, lalu samakan di semua berkas (hanya di mesin build).
      - name: Tentukan versi rilis
        shell: pwsh
        run: |
          git fetch --tags --force
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/heads/*') {
            while (git tag -l "v$v") {
              $p = $v.Split('.'); $v = "{0}.{1}.{2}" -f $p[0], $p[1], ([int]$p[2] + 1)
            }
            node scripts/version.js set $v
          }
          "VERSI_RILIS=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Versi rilis: $v"

      - name: Cek versi sama di semua tempat
        run: node scripts/version.js check

      - name: Tag harus sama dengan versi
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME tidak sama dengan versi v$v" }

      - name: Tes jembatan sidecar, updater, dan pengukur dock
        run: |
          node test/sidecar-test.js
          node test/updater-test.js
          node test/dock-measure-test.js
          node test/protect-test.js
          node test/hotkey-test.js

      - name: Siapkan bahan (UI, server, splash)
        run: node scripts/build-tauri.js

      # node.exe dipakai sebagai proses pendamping (menjalankan server lama). Versi dikunci + diverifikasi SHA-256 dari nodejs.org.
      - name: Unduh node.exe
        shell: pwsh
        run: |
          $v = 'v22.11.0'
          Invoke-WebRequest "https://nodejs.org/dist/$v/win-x64/node.exe" -OutFile node.exe
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/$v/SHASUMS256.txt").Content
          $line = ($sums -split "`n") | Where-Object { $_ -match 'win-x64/node\.exe\s*$' } | Select-Object -First 1
          if (-not $line) { throw 'baris node.exe tidak ada di SHASUMS256.txt' }
          $want = ($line.Trim() -split '\s+')[0].ToLower()
          $got = (Get-FileHash node.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum node.exe tidak cocok ($got != $want)" }
          Move-Item node.exe shell/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Build installer (NSIS)
        working-directory: shell
        run: npx --yes @tauri-apps/cli@2 build

      - name: Siapkan berkas rilis (nama tanpa spasi + catatan rilis)
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $src = Get-ChildItem shell/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "ChatStream-Labs_${v}_x64-setup.exe"
          Copy-Item $src.FullName "dist/$name"
          $h = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          # catatan rilis (bukan berkas aset): dipakai auto-update sebagai cadangan kalau 'digest' aset dari GitHub tidak ada
          "Pra-rilis ChatStream Labs v$v`n`nSHA-256: $h`n" | Out-File -Encoding utf8 -NoNewline dist/catatan-rilis.md
          "{0}: {1:N1} MB" -f $name, ((Get-Item "dist/$name").Length / 1MB)
          "{0:N1} MB (exe aplikasi saja)" -f ((Get-Item shell/src-tauri/target/release/chatstream-labs.exe).Length / 1MB)

      # v1.1.8: tidak ada upload artifact lagi (kuota habis); installer langsung jadi aset pra-rilis.
      - name: Buat pra-rilis (push ke main atau tag; bukan Run workflow manual)
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSI_RILIS }}
          target_commitish: ${{ github.sha }}
          name: ChatStream Labs v${{ env.VERSI_RILIS }}
          prerelease: true
          body_path: dist/catatan-rilis.md
          files: dist/*.exe
